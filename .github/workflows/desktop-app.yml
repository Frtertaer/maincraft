name: Desktop app

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'app/**'
      - 'agent/**'
      - '.github/workflows/desktop-app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'agent/**'
      - '.github/workflows/desktop-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            agent/package-lock.json

      - name: Agent — install
        working-directory: agent
        run: npm ci

      - name: Agent — self-test
        working-directory: agent
        run: npm run check

      - name: App — install
        working-directory: app
        run: npm ci

      - name: App — typecheck
        working-directory: app
        run: npm run typecheck

      - name: App — unit tests
        working-directory: app
        run: npm test

      - name: App — build
        working-directory: app
        run: npm run build

  windows-installer:
    name: Windows installer
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            agent/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build app
        working-directory: app
        run: npm run build

      - name: Bundle the Minecraft agent (Windows binaries)
        working-directory: app
        run: npm run agent:bundle

      - name: Package installer
        working-directory: app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            npx electron-builder --win --x64 --publish always
          else
            npx electron-builder --win --x64 --publish never
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Maincraft-Setup-windows
          path: |
            app/dist/*.exe
            app/dist/latest.yml
          if-no-files-found: error
          retention-days: 30
